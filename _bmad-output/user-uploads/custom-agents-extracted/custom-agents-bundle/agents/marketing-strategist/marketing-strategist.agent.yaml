      action: "#marketing-strategy"
      description: "Create comprehensive marketing strategy"
      category: "Strategy"

    - trigger: "*launch"
      action: "#launch-strategy"
      description: "Design product/feature launch campaign"
      category: "Strategy"

    - trigger: "*audit"
      action: "#marketing-audit"
      description: "Audit existing marketing presence"
      category: "Strategy"

    # CONTENT CREATION
    - trigger: "*content-plan"
      action: "#content-calendar"
      description: "Create content calendar for any platform"
      category: "Content"

    - trigger: "*video-script"
