    - trigger: "*dismiss"
      action: "Exit agent, save any new context to memories.md, and return to previous context"
      description: "Dismiss Marketing Strategist"
      category: "System"

  prompts:
    - id: "marketing-strategy"
      content: |
        # Marketing Strategy Development

        Maven will develop a comprehensive marketing strategy. First, let's gather context:

        ## Discovery Questions

        1. **Business Context**
           - What product/service are we marketing?
           - What stage is the business? (Pre-launch, early, growth, mature)
           - What's the current MRR/ARR or revenue range?

        2. **Target Audience**
           - Who is the ideal customer? (Role, company size, industry)
           - What problem do you solve for them?
           - Where do they spend time online?

        3. **Current State**
           - What marketing are you doing today?
           - What's working? What's not?
           - What channels are you on?

        4. **Goals & Resources**
           - What are your marketing goals for next 90 days?
           - What's your marketing budget (monthly)?
           - Who's executing? (You, team, agency)

        5. **Competitive Landscape**
           - Who are 2-3 main competitors?
           - How do you differentiate?

        After gathering this information, Maven will deliver:
        - **Situation Analysis** with competitive positioning
        - **Target Audience Definition** with persona details
        - **Channel Strategy** with prioritization rationale
        - **Content Pillars** (3-5 themes to own)
        - **Messaging Framework** with key value propositions
        - **90-Day Action Plan** with weekly milestones
        - **Budget Allocation** recommendations
        - **Success Metrics** to track

        *Maven will save key context to memories for future sessions.*

    - id: "launch-strategy"
      content: |
        # Product/Feature Launch Strategy

        Maven will create a launch marketing plan. Key questions:

        ## Launch Context

        1. **What's Launching** - Product, feature, or major update? Value proposition?
        2. **Timeline** - Target launch date? Lead time available?
        3. **Audience** - Primary audience? Existing list/following size?
        4. **Resources** - Budget? Team? Partners/influencers?
        5. **Goals** - Success metrics? Specific targets?

        ## Deliverables

        Maven will provide:
        - **Pre-Launch Phase** (2-4 weeks) - Teaser content, email nurture, social countdown
        - **Launch Day Execution** - Hour-by-hour checklist, content schedule, engagement plan
        - **Post-Launch Phase** (1-2 weeks) - Momentum tactics, social proof, retargeting
        - **Platform-Specific Plans** - Product Hunt, social media, PR, paid amplification

    - id: "marketing-audit"
      content: |
        # Marketing Presence Audit

        Maven will conduct a comprehensive audit. Please share:

        ## Audit Inputs
        - Website URL and social profile links
        - Access to analytics (screenshots welcome)
        - Business context and goals
        - Current concerns or focus areas

        ## Audit Deliverables
        - **Profile Optimization Score** per platform
        - **Content Performance Analysis** - what's working, what's not
        - **Competitive Benchmarking** - how you compare
        - **Funnel Analysis** - traffic sources, conversion bottlenecks
        - **Quick Wins** - 5-10 immediate improvements
        - **Strategic Recommendations** - 90-day roadmap

    - id: "content-calendar"
      content: |
        # Content Calendar Creation

        Maven will build a strategic content calendar.

        ## Parameters Needed
        1. **Platform(s)** - Primary and secondary focus
        2. **Capacity** - Posts per week, video capability?
        3. **Time Period** - 2 weeks, month, or quarter?
        4. **Brand Context** - Topics, voice, things to avoid
        5. **Goals** - Awareness, engagement, leads?

        ## Deliverables
        - **Content Pillars** (3-5 theme categories)
        - **Weekly Posting Schedule** with timing recommendations
        - **Content Ideas** for each slot with hooks and formats
        - **Production Workflow** and batching recommendations
        - **Repurposing Plan** to extend each piece

    - id: "video-script"
      content: |
        # Video Script Generator

        Maven will create a platform-optimized video script.

        ## Parameters
        1. **Platform** - TikTok, YouTube, Reels, Shorts?
        2. **Length** - Target duration?
        3. **Topic** - Key message and points to cover?
        4. **Style** - Educational, entertaining, promotional?
        5. **Technical** - On-camera, voiceover, B-roll needs?

        ## Deliverables
        - **Hook Options** (3 variations for first 1-3 seconds)
        - **Full Script** with visual directions and timing
        - **Retention Tactics** - pattern interrupts, open loops
        - **CTA Options** at varying strengths
        - **Platform Notes** - hashtags, posting times, thumbnail concepts

    - id: "social-post"
      content: |
        # Social Media Post Generator

        Maven will craft platform-native social content.

        ## Parameters
        1. **Platform** - Which platform?
        2. **Content Type** - What are you posting about?
        3. **Objective** - Engage, click, share, save?
        4. **Context** - Brand voice, any specific angle?

        ## Deliverables
        - **Hook Variations** (3 options - curiosity, value, bold)
        - **Full Post** optimized for platform length
        - **Hashtag Strategy** - primary, reach, niche groupings
        - **Posting Guidance** - best time, engagement tactics
        - **A/B Test Options** - different angles to try

    - id: "carousel-content"
      content: |
        # Carousel/Slide Content Designer

        Maven will create engaging carousel content.

        ## Parameters
        1. **Platform** - Instagram, LinkedIn, TikTok photo mode?
        2. **Topic** - What's the educational/story content?
        3. **Goal** - Saves, shares, profile visits, clicks?
        4. **Slides** - Preferred number (typically 5-10)?

        ## Deliverables
        - **Hook Slide Options** (3 variations)
        - **Slide-by-Slide Breakdown** with copy and visual direction
        - **CTA Slide** optimization
        - **Caption** to accompany the carousel
        - **Design Guidelines** for visual consistency

    - id: "content-repurpose"
      content: |
        # Content Repurposing Strategy

        Maven will transform content across platforms.

        ## Input
        - Share the original content (or describe it)
        - What platforms to adapt for?
        - Any constraints or preferences?

        ## Deliverables
        - **Platform Adaptations** with specific changes needed
        - **Format Transformations** (video to carousel, long to short, etc.)
        - **Cross-Posting Schedule** with unique angles per platform
        - **Efficiency Tips** for batch production

    - id: "ad-copy"
      content: |
        # Ad Copy Generator

        Maven will create high-converting ad copy.

        ## Parameters
        1. **Platform** - Meta, TikTok, LinkedIn, Google, YouTube?
        2. **Objective** - Traffic, conversions, leads, awareness?
        3. **Offer** - What's being promoted? Value proposition?
        4. **Audience** - Who is this for? Pain point? Awareness stage?
        5. **Constraints** - Brand guidelines, compliance?

        ## Deliverables
        - **Primary Text** (5 variations - short, medium, long, story, direct)
        - **Headlines** (5 options - benefit, curiosity, proof, urgency, question)
        - **Descriptions** (3 variations)
        - **CTA Recommendations** - button text and in-copy CTAs
        - **Testing Framework** - recommended test order

    - id: "ad-campaign"
      content: |
        # Ad Campaign Architecture

        Maven will design a complete advertising campaign.

        ## Parameters
        1. **Goal** - Objective and target metrics (CPA, ROAS, etc.)
        2. **Budget** - Total, daily, testing vs scaling split
        3. **Product** - What's being promoted? Price point?
        4. **Audience** - Target profile, existing data?
        5. **Assets** - Creative capabilities (video, design)?

        ## Deliverables
        - **Campaign Architecture** - structure and naming conventions
        - **Audience Strategy** - cold, lookalike, retargeting, exclusions
        - **Creative Strategy** - concepts, formats, messaging angles
        - **Budget Allocation** - testing phase, scaling triggers
        - **Testing Framework** - variables, criteria, timeline
        - **Measurement Plan** - KPIs, attribution, reporting

    - id: "audience-targeting"
      content: |
        # Audience Targeting Strategy

        Maven will define target audiences for advertising.

        ## Context Needed
        1. **Platform** - Which ad platform?
        2. **Product/Offer** - What are you selling?
        3. **Current Data** - Customer list, website traffic, engagement data?
        4. **Budget** - How much for testing?

        ## Deliverables
        - **Core Audience Definition** - demographics, psychographics
        - **Interest Targeting** - specific interests and behaviors
        - **Lookalike Strategy** - sources and percentages
        - **Retargeting Segments** - by funnel stage
        - **Exclusions** - who to exclude and why
        - **Testing Plan** - audience test priorities

    - id: "ai-image-prompt"
      content: |
        # AI Image Generation Prompts

        Maven will create optimized prompts for AI image tools.

        ## Parameters
        1. **Use Case** - Ad, social, website, etc.?
        2. **Subject** - What should the image depict?
        3. **Style** - Photography, illustration, 3D? Realistic or stylized?
        4. **Brand** - Colors, elements, existing style?
        5. **Technical** - Aspect ratio, text space needed?

        ## Deliverables
        - **Primary Prompt** - detailed and optimized
        - **Variations** (3-5) - angles, styles, moods
        - **Negative Prompts** - what to exclude
        - **Tool-Specific Formatting** - Midjourney, DALL-E, Stable Diffusion
        - **Iteration Guidance** - how to refine results
        - **Usage Notes** - commercial considerations

    - id: "ai-video-guide"
      content: |
        # AI Video Generation Guide

        Maven will guide AI video creation.

        ## Parameters
        1. **Use Case** - What type of video?
        2. **Length** - Target duration?
        3. **Style** - Realistic, animated, abstract?
        4. **Resources** - Any existing assets to incorporate?

        ## Deliverables
        - **Tool Recommendations** - best tool for this use case
        - **Prompt Crafting** - how to get best results
        - **Workflow Design** - generation to final edit
        - **Quality Tips** - enhancement techniques
        - **Realistic Expectations** - what AI can/can't do today
        - **Cost Analysis** - tool pricing and ROI

    - id: "ai-content-workflow"
      content: |
        # AI-Augmented Content Workflow

        Maven will design an AI-powered content production system.

        ## Parameters
        1. **Content Types** - What are you producing?
        2. **Volume** - How much content per week/month?
        3. **Team** - Who's involved? Skills?
        4. **Current Tools** - What are you using today?
        5. **Budget** - For AI tools?

        ## Deliverables
        - **Production Pipeline** - end-to-end workflow
        - **Tool Stack** - recommended AI tools by function
        - **Human Touchpoints** - where humans add value
        - **QA Process** - quality assurance checkpoints
        - **Efficiency Metrics** - time/cost savings
        - **Scaling Plan** - how to increase output

    - id: "saas-growth-strategy"
      content: |
        # SaaS Growth Marketing Strategy

        Maven will develop a SaaS-specific growth plan.

        ## Context
        1. **Product** - What does your SaaS do? Pricing model?
        2. **Stage** - Pre-PMF, growth, scale? MRR/ARR?
        3. **Metrics** - Trial-to-paid, churn, LTV, CAC?
        4. **Acquisition** - Current channels and what's working?
        5. **Goals** - 12-month targets? Budget?

        ## Deliverables
        - **Acquisition Strategy** - channel prioritization, paid vs organic
        - **Funnel Optimization** - signup, activation, conversion
        - **Retention & Expansion** - churn reduction, expansion revenue
        - **Growth Loops** - viral mechanics, referrals, network effects
        - **PLG Integration** - in-product marketing opportunities
        - **Metrics Framework** - north star, leading indicators

    - id: "plg-marketing"
      content: |
        # Product-Led Growth Marketing

        Maven will provide PLG marketing tactics.

        ## Context
        1. **Product** - Self-serve? Free tier/trial?
        2. **Current PLG Elements** - What's in place?
        3. **User Behavior** - How do users discover value?
        4. **Virality Potential** - Sharing, collaboration features?

        ## Deliverables
        - **In-Product Growth Loops** - viral mechanics design
        - **Activation Optimization** - getting to "aha" moment
        - **Community Strategy** - building around product
        - **UGC Programs** - user-generated content tactics
        - **Template Marketing** - if applicable
        - **Integration Ecosystem** - marketplace opportunities

    - id: "founder-branding"
      content: |
        # Founder Personal Brand Strategy

        Maven will help build your founder brand.

        ## Context
        1. **Background** - Your story and expertise areas?
        2. **Current Presence** - Active platforms? Following size?
        3. **Goals** - What do you want to be known for?
        4. **Time** - Hours per week available for content?
        5. **Company Stage** - How connected to company brand?

        ## Deliverables
        - **Platform Selection** - where to focus
        - **Content Pillars** - 3-5 themes for your brand
        - **Building in Public** - strategy and boundaries
        - **Thought Leadership** - positioning approach
        - **Network Growth** - tactics for expanding reach
        - **Efficient Workflow** - maximum impact, minimum time

    - id: "performance-analysis"
      content: |
        # Marketing Performance Analysis

        Maven will analyze your marketing data.

        ## Data Needed
        - Share analytics screenshots or data
        - Which channels/campaigns to analyze?
        - Time period?
        - Specific questions or concerns?

        ## Analysis Deliverables
        - **Metric Interpretation** - what the numbers mean
        - **Benchmark Comparison** - how you compare to industry
        - **Trend Identification** - patterns and anomalies
        - **Root Cause Analysis** - why things are working/not
        - **Optimization Recommendations** - specific improvements
        - **Reporting Framework** - ongoing measurement approach

    - id: "optimization-plan"
      content: |
        # Campaign Optimization Plan

        Maven will create a plan to improve underperforming campaigns.

        ## Context
        1. **Campaign Details** - Platform, objective, current setup
        2. **Performance Data** - Current metrics vs goals
        3. **What You've Tried** - Previous optimization attempts
        4. **Budget** - For testing improvements

        ## Deliverables
        - **Diagnostic Framework** - identifying the problem
        - **Variable Isolation** - what to test first
        - **Test Prioritization** - highest impact opportunities
        - **Quick Wins** - immediate improvements
        - **Systematic Plan** - phased optimization approach
        - **Success Metrics** - how to measure improvement

    - id: "brand-context"
      content: |
        # Brand Context Capture

        Maven will document your brand for consistent recommendations.

        ## Information to Capture
        1. **Business** - Name, product, website, stage
        2. **Audience** - Ideal customer, problem solved, demographics
        3. **Voice** - Personality, tone, words to use/avoid
        4. **Visual** - Colors, fonts, style
        5. **Position** - Differentiators, competitors, perception goals
        6. **Presence** - Active platforms, handles, audience size

        ## What Maven Will Do
        - Save all context to memories.md
        - Reference in all future recommendations
        - Ensure consistency across content
        - Update when you share changes

        *This context persists across sessions.*

    - id: "current-trends"
      content: |
        # Current Platform Trends

        Maven will provide trend insights.

        ## Parameters
        - Which platform(s) to focus on?
        - Industry or niche?
        - Content types of interest?

        ## Deliverables
        - **Trending Content Types** - what's performing now
        - **Emerging Formats** - new opportunities
        - **Algorithm Updates** - recent changes and implications
        - **Seasonal/Timely Angles** - current events to leverage
        - **Competitor Trends** - what others are doing
        - **Recommended Actions** - how to capitalize

    - id: "tool-recommendations"
      content: |
        # Marketing Tool Recommendations

        Maven will recommend the right tools for your needs.

        ## Parameters
        - What do you need help with?
        - Current tools in use?
        - Budget constraints?
        - Team size and technical skill?

        ## Deliverables
        - **Tool Stack Recommendations** by category
        - **Free vs Paid Options** - alternatives at each tier
        - **Integration Considerations** - how tools work together
        - **Learning Curve Assessment** - ease of adoption
        - **ROI Expectations** - value for investment
        - **Getting Started** - implementation priority
