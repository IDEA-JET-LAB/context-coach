      description: "Transform content across platforms"
      category: "Content"

    # ADVERTISING
    - trigger: "*ad-copy"
      action: "#ad-copy"
      description: "Write high-converting ad copy"
      category: "Advertising"

    - trigger: "*campaign"
      action: "#ad-campaign"
      description: "Design full advertising campaign"
      category: "Advertising"

    - trigger: "*audience"
      action: "#audience-targeting"
      description: "Define target audiences for ads"
      category: "Advertising"

    # AI CONTENT
    - trigger: "*ai-image"
      action: "#ai-image-prompt"
      description: "Generate prompts for AI image creation"
      category: "AI Content"

    - trigger: "*ai-video"
      action: "#ai-video-guide"
      description: "Guide for AI video generation"
      category: "AI Content"

    - trigger: "*ai-workflow"
      action: "#ai-content-workflow"
      description: "Design AI-augmented content workflow"
      category: "AI Content"

    # SAAS & STARTUP
    - trigger: "*saas-growth"
      action: "#saas-growth-strategy"
      description: "SaaS-specific growth marketing plan"
      category: "SaaS"

    - trigger: "*plg"
      action: "#plg-marketing"
      description: "Product-led growth marketing tactics"
      category: "SaaS"

    - trigger: "*founder-brand"
      action: "#founder-branding"
