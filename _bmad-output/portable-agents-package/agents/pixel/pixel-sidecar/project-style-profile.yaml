# Contextor - Project Style Profile
# Generated by Pixel on 2025-12-21
# Project: Contextor - Prompt Journaling for AI Teams

project:
  name: "Contextor"
  type: "Next.js SaaS Application"
  description: "Prompt journaling system for AI-assisted development teams"
  framework: "Next.js 15 (App Router)"
  ui_library: "shadcn/ui + Radix UI"

colors:
  # Light Mode (Default)
  light:
    background: "#FFFFFF"          # Pure white
    foreground: "#0A0A0A"          # Near black (HSL 0 0% 3.9%)
    primary: "#171717"             # Dark gray (HSL 0 0% 9%)
    primary_foreground: "#FAFAFA"  # Near white (HSL 0 0% 98%)
    secondary: "#F5F5F5"           # Light gray (HSL 0 0% 96.1%)
    secondary_foreground: "#171717"
    muted: "#F5F5F5"
    muted_foreground: "#737373"    # Medium gray (HSL 0 0% 45.1%)
    accent: "#F5F5F5"
    border: "#E5E5E5"              # Light border (HSL 0 0% 89.8%)
    destructive: "#EF4444"         # Red (HSL 0 84.2% 60.2%)

  # Dark Mode
  dark:
    background: "#0A0A0A"          # Near black
    foreground: "#FAFAFA"          # Near white
    primary: "#FAFAFA"
    primary_foreground: "#171717"
    secondary: "#262626"           # Dark gray (HSL 0 0% 14.9%)
    secondary_foreground: "#FAFAFA"
    muted: "#262626"
    muted_foreground: "#A3A3A3"    # Medium gray (HSL 0 0% 63.9%)
    accent: "#262626"
    border: "#262626"
    destructive: "#7F1D1D"         # Dark red (HSL 0 62.8% 30.6%)

  # Chart/Data Visualization Colors
  chart:
    - "#E26A2C"  # Warm orange (chart-1: HSL 12 76% 61%)
    - "#28A27C"  # Teal green (chart-2: HSL 173 58% 39%)
    - "#264653"  # Deep teal (chart-3: HSL 197 37% 24%)
    - "#E9C46A"  # Golden yellow (chart-4: HSL 43 74% 66%)
    - "#F4A261"  # Soft orange (chart-5: HSL 27 87% 67%)

  # Palette Summary
  palette_mood: "Neutral monochrome with warm accents for data visualization"
  primary_scheme: "Grayscale"
  contrast_style: "High contrast (dark on light, light on dark)"

typography:
  primary_font: "Geist Sans"
  font_source: "Google Fonts (next/font)"
  font_category: "Sans-serif, Modern, Geometric"
  font_weights:
    - regular: 400
    - medium: 500
    - semibold: 600
  text_rendering: "antialiased"
  heading_style: "font-semibold leading-none tracking-tight"
  body_style: "text-sm"

visual_patterns:
  # Border Radius
  border_radius:
    base: "0.5rem"          # --radius
    lg: "0.5rem"
    md: "calc(0.5rem - 2px)"
    sm: "calc(0.5rem - 4px)"
    xl: "0.75rem"           # rounded-xl used on cards

  # Shadows
  shadows:
    card: "shadow"          # Standard Tailwind shadow
    button: "shadow-xs"     # Subtle outline button shadow

  # Spacing
  spacing:
    card_padding: "p-6"
    card_header_gap: "space-y-1.5"
    button_gap: "gap-2"

  # Transitions
  transitions:
    default: "transition-all"

  # Icons
  icon_size: "size-4"       # 16x16 default
  icon_style: "Lucide icons (line style)"

component_patterns:
  cards:
    style: "rounded-xl border shadow"
    background: "bg-card"
    text: "text-card-foreground"

  buttons:
    style: "rounded-md font-medium"
    default_height: "h-9"
    interaction: "hover:bg-primary/90"

  inputs:
    border: "border-input"
    focus: "focus-visible:ring-ring/50 focus-visible:ring-[3px]"

dark_mode:
  enabled: true
  toggle_method: "class"    # .dark class on html element
  default_preference: "system"

image_guidelines:
  # Recommendations for generated images
  preferred_backgrounds:
    light_mode: "#FFFFFF or transparent"
    dark_mode: "#0A0A0A (for solid) or transparent"

  color_compatibility:
    - "Use neutral grays (#171717, #737373, #A3A3A3) for main subjects"
    - "Use chart colors for accents and highlights"
    - "Avoid saturated colors that clash with neutral UI"

  style_recommendations:
    - "Clean, minimal aesthetic matching Geist font personality"
    - "Modern and professional - suitable for SaaS/developer tools"
    - "Prefer geometric/abstract over photorealistic"
    - "Line art or flat illustration style preferred for icons"
    - "High contrast for accessibility"

  aspect_ratios:
    icons: "1:1"
    feature_cards: "4:3 or 16:9"
    hero: "16:9 or 21:9"
    avatars: "1:1"

output_config:
  staging_folder: "./pixel-sidecar/staging"
  default_destination: "../../app/public/images/generated"
  naming_convention: "{description}-{context}-v{version}.png"
  default_format: "png"
  default_resolution: "1K"
