# =============================================================================
# Publish CLI to npm
# Triggered when a release is created with a tag starting with 'cli-v'
# =============================================================================

name: Publish CLI to npm

on:
  release:
    types: [published]

jobs:
  publish:
    # Only run for CLI releases (tags like cli-v1.0.0)
    if: startsWith(github.event.release.tag_name, 'cli-v')
    runs-on: ubuntu-latest

    steps:
      # SECURITY: Pin actions to commit SHAs to prevent supply-chain attacks
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install dependencies
        working-directory: packages/cli
        run: npm ci

      - name: Build
        working-directory: packages/cli
        run: npm run build

      - name: Run tests
        working-directory: packages/cli
        run: npm test

      - name: Verify package contents
        working-directory: packages/cli
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify publication
        run: |
          # Poll npm registry until package is indexed (max 30s)
          for i in {1..6}; do
            echo "Verification attempt $i/6..."
            if npm view @contextor/cli version 2>/dev/null; then
              echo "Successfully published @contextor/cli to npm!"
              exit 0
            fi
            if [ $i -lt 6 ]; then
              sleep 5  # Wait 5s between attempts
            fi
          done

          echo "Package not found in npm registry after 30s"
          exit 1
