# =============================================================================
# Deploy Workflow - Runs on push to main
# Builds, tests, and deploys to Google Cloud Run
# =============================================================================

name: Deploy to Production

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: contextor-web
  REGION: us-central1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # SECURITY: Pin actions to commit SHAs to prevent supply-chain attacks
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Type check
        working-directory: app
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: app
        run: npm run test:unit:run

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      # SECURITY: Pin actions to commit SHAs to prevent supply-chain attacks
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2

      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Build Docker image
        working-directory: app
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }} \
            --build-arg NEXT_PUBLIC_APP_URL=https://contextor.co \
            -t gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
            -t gcr.io/$PROJECT_ID/$SERVICE_NAME:latest \
            .

      - name: Push Docker image
        run: |
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }}
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/$SERVICE_NAME:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 10 \
            --memory 512Mi \
            --cpu 1 \
            --port 3000 \
            --set-env-vars="NODE_ENV=production,NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }},NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            --set-secrets="SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,UPSTASH_REDIS_URL=UPSTASH_REDIS_URL:latest,UPSTASH_REDIS_TOKEN=UPSTASH_REDIS_TOKEN:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest"

      - name: Verify deployment
        run: |
          SERVICE_URL=$(gcloud run services describe $SERVICE_NAME --region $REGION --format 'value(status.url)')
          echo "Deployed to: $SERVICE_URL"

          # Poll health endpoint with exponential backoff (max 60s)
          for i in {1..6}; do
            echo "Health check attempt $i/6..."
            if curl -f "$SERVICE_URL/api/health" 2>/dev/null; then
              echo "Deployment verified successfully!"
              exit 0
            fi
            if [ $i -lt 6 ]; then
              sleep $((2 ** i))  # Exponential backoff: 2s, 4s, 8s, 16s, 32s
            fi
          done

          echo "Health check failed after 6 attempts"
          exit 1
